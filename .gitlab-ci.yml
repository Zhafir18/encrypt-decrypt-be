stages:
  - build
  - deploy

variables:
  IMAGE_NAME: 'e-dcrypt-be'
  IMAGE_TAG: 'latest'
  IMAGE_FULL: '$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$IMAGE_NAME:$IMAGE_TAG'
  CONTAINER_NAME: '$IMAGE_NAME-container'
  CS_REGISTRY_USER: '$CI_REGISTRY_USER'
  CS_REGISTRY_PASSWORD: '$CI_REGISTRY_PASSWORD'
  CS_IMAGE: '$IMAGE_FULL'
  SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
  GIT_DEPTH: '0'
  PORT: 1307

build:
  stage: build
  tags:
    - shell
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $IMAGE_FULL .
    - docker push $IMAGE_FULL
    - docker image prune -f
  only:
    - main

deploy:
  stage: deploy
  tags:
    - shell
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker ps -q --filter "name=$CONTAINER_NAME" | xargs -r docker stop
    - docker ps -a -q --filter "name=$CONTAINER_NAME" | xargs -r docker rm
    - docker pull $IMAGE_FULL
    - docker run --restart unless-stopped -d -p $PORT:$PORT --name $CONTAINER_NAME $IMAGE_FULL
    - docker image prune -f
  only:
    - main
